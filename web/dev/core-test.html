<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hymnal Reader · core test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/core.css">
  <style>
    /* Developer test page for Phase 6 (data, audio, speech core). Not the real UI. */
    body { padding: 20px; max-width: 1100px; margin: 0 auto; font-size: 18px; }
    h1 { font-family: var(--font-read); margin: 0 0 4px; }
    .muted { color: var(--muted); }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 14px 0; }
    button, select { font: inherit; min-height: 48px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0; }
    #start { min-height: var(--touch); font-size: 24px; width: 100%; }
    #lyrics { max-height: 380px; overflow: auto; padding: 8px; }
    #verses p { font-family: var(--font-read); font-size: 24px; margin: 8px 0; padding: 4px 6px; }
    #verses sup { color: var(--muted); }
    #prayer p { font-family: var(--font-read); font-size: 22px; text-align: center; margin: 6px 0; padding: 2px 6px; }
    .meter { width: 200px; height: 14px; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .meter > div { height: 100%; background: var(--accent); width: 100%; transition: width 100ms; }
    #log { font: 13px/1.4 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; }
    #sheet { max-height: 520px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Core test</h1>
  <p class="muted">Phase 6 check: a hymn plays with highlighted words, then Psalm 23:1-3 is read aloud while the music ducks.</p>

  <button id="start" class="primary">Tap to start (unlocks sound and speech)</button>

  <section>
    <div class="row">
      <label for="hymn">Hymn</label>
      <select id="hymn" disabled><option>Loading published hymns…</option></select>
      <button id="play" disabled>Play</button>
      <button id="pause" disabled>Pause</button>
      <button id="stopHymn" disabled>Stop</button>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    </div>
    <div class="row muted"><span id="verseNo"></span> <span id="sheetStatus"></span></div>
    <div id="lyrics"></div>
    <div class="row"><button id="toggleSheet" disabled>Show sheet music</button></div>
    <div id="sheet" hidden></div>
  </section>

  <section>
    <div class="row">
      <button id="speakPsalm" disabled>Read Psalm 23:1-3</button>
      <button id="speakPrayer" disabled>Read a prayer</button>
      <button id="sPause" disabled>Pause</button>
      <button id="sResume" disabled>Resume</button>
      <button id="sRepeat" disabled>Read again</button>
      <button id="sStop" disabled>Stop</button>
    </div>
    <div class="row">
      <label>Speed <select id="rate"><option value="slower">Slower</option><option value="slow" selected>Slow</option><option value="normal">Normal</option></select></label>
      <label>Voice <select id="voice"><option value="">Default</option></select></label>
      <span>Music level <span class="meter"><div id="duck"></div></span> <span id="duckPct"></span></span>
    </div>
    <h3 id="ref"></h3>
    <div id="verses"></div>
    <p id="attribution" class="muted"></p>
    <div id="prayer"></div>
    <p id="prayerSource" class="muted"></p>
  </section>

  <section>
    <button id="runAll" class="primary" disabled>Run the Phase 6 check: hymn, then Psalm 23:1-3</button>
    <div id="log"></div>
  </section>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script type="module">
    import * as api from '../js/api.js';
    import { AudioPlayer } from '../js/audio.js';
    import { Speaker, localVoices, splitLines, speechSupported } from '../js/speech.js';
    import { LyricsView } from '../js/lyrics.js';
    import { createSheet } from '../js/sheet.js';

    const $ = (id) => document.getElementById(id);
    const log = (msg) => { $('log').textContent += `${new Date().toLocaleTimeString()}  ${msg}\n`; $('log').scrollTop = 1e9; console.log(msg); };
    window.addEventListener('error', (e) => log(`ERROR ${e.message}`));
    window.addEventListener('unhandledrejection', (e) => log(`ERROR ${e.reason?.message ?? e.reason}`));

    const audio = new AudioPlayer();
    const speaker = new Speaker({ ducker: audio });
    const lyrics = new LyricsView($('lyrics'), {
      getTime: () => audio.position,
      onVerse: ({ n, total, intro }) => { $('verseNo').textContent = intro ? 'Intro' : n ? `Verse ${n} of ${total}` : `${total} verses (words without highlighting)`; },
    });
    const sheet = createSheet($('sheet'), { getTime: () => audio.position, onStatus: (s) => { $('sheetStatus').textContent = s ? `· ${s}` : ''; } });
    let hymns = [], current = null, timing = null;

    // Load published hymns that have audio.
    try {
      hymns = (await api.getHymns()).filter((h) => h.audio_path);
      $('hymn').replaceChildren(...hymns.map((h) => new Option(`#${h.number} ${h.title}${h.timing_verified ? '' : ' (no highlighting)'}`, h.number)));
      if (!hymns.length) $('hymn').replaceChildren(new Option('No published hymn with audio yet: publish one in the admin app'));
      log(`${hymns.length} published hymn(s) with audio`);
    } catch (e) { log(`ERROR loading hymns: ${e.message}`); }

    // Voices (local only).
    if (!speechSupported) log('This browser has no speech synthesis');
    const voices = await localVoices();
    $('voice').append(...voices.map((v, i) => new Option(`${v.name} (${v.lang})`, i)));
    $('voice').onchange = () => speaker.setVoice(voices[$('voice').value] ?? null);
    $('rate').onchange = () => speaker.setRate($('rate').value);
    log(`${voices.length} local voice(s)`);

    // Meter: show the duck gain live.
    (function meter() { const v = audio.duckLevel; $('duck').style.width = `${v * 100}%`; $('duckPct').textContent = `${Math.round(v * 100)}%`; requestAnimationFrame(meter); })();

    $('start').onclick = async () => {
      const ok = await audio.unlock();
      speaker.unlock();
      log(`unlocked: audio ${ok ? 'running' : 'NOT running'}`);
      $('start').textContent = 'Ready';
      for (const id of ['hymn', 'play', 'pause', 'stopHymn', 'toggleSheet', 'speakPsalm', 'speakPrayer', 'sPause', 'sResume', 'sRepeat', 'sStop', 'runAll']) $(id).disabled = false;
      if (!hymns.length) for (const id of ['play', 'pause', 'stopHymn', 'toggleSheet', 'runAll']) $(id).disabled = true;
    };

    async function playHymn() {
      current = hymns.find((h) => h.number === Number($('hymn').value));
      timing = await api.getTiming(current);
      lyrics.setData(timing);
      if (!$('sheet').hidden) await sheet.show(timing);
      const t0 = performance.now();
      await audio.play(api.audioUrl(current));
      log(`playing #${current.number} ${current.title} (audio ready in ${Math.round(performance.now() - t0)} ms, synced=${timing.synced})`);
      lyrics.start(); sheet.start();
    }
    $('play').onclick = () => (audio.currentUrl && audio.paused ? audio.resume() : playHymn());
    $('pause').onclick = () => audio.pause();
    $('stopHymn').onclick = () => { audio.stop(); lyrics.stop(); sheet.stop(); };
    $('volume').oninput = () => audio.setVolume(Number($('volume').value));
    audio.addEventListener('ended', () => log('hymn ended'));
    $('toggleSheet').onclick = async () => {
      const show = $('sheet').hidden;
      $('sheet').hidden = !show;
      $('toggleSheet').textContent = show ? 'Hide sheet music' : 'Show sheet music';
      if (show && timing) { await sheet.show(timing); sheet.start(); }
    };

    // Read-aloud with highlighting of the current verse / line.
    let marked = [];
    speaker.addEventListener('segment', (e) => { marked.forEach((p, i) => p.classList.toggle('reading', i === e.detail.index)); log(`reading part ${e.detail.index + 1}`); });
    speaker.addEventListener('state', (e) => log(`speech: ${e.detail}`));
    speaker.addEventListener('end', () => marked.forEach((p) => p.classList.remove('reading')));

    async function readPsalm() {
      const p = await api.getPassage('PSA', 23, 1, 3);
      $('ref').textContent = `${p.reference} · Reading aloud · ${$('rate').selectedOptions[0].text}`;
      $('attribution').textContent = p.attribution;
      $('verses').replaceChildren(...p.verses.map((v) => { const el = document.createElement('p'); el.innerHTML = `<sup>${v.num}</sup> `; el.append(v.text); return el; }));
      marked = [...$('verses').children];
      await speaker.speakVerses(p.verses);
    }
    $('speakPsalm').onclick = readPsalm;
    $('speakPrayer').onclick = async () => {
      const prayer = (await api.getPrayers()).find((p) => p.slug === 'support-us-all-the-day') ?? (await api.getPrayers())[0];
      $('prayer').replaceChildren(...splitLines(prayer.text).map((line) => Object.assign(document.createElement('p'), { textContent: line })));
      $('prayerSource').textContent = prayer.attribution ?? prayer.source;
      marked = [...$('prayer').children];
      await speaker.speakText(prayer.text);
    };
    $('sPause').onclick = () => speaker.pause();
    $('sResume').onclick = () => speaker.resume();
    $('sRepeat').onclick = () => speaker.repeat();
    $('sStop').onclick = () => speaker.stop();

    // The Phase 6 check: hymn with highlighted words, then Psalm 23:1-3 read over the
    // ducked music, then the music comes back up.
    $('runAll').onclick = async () => {
      await playHymn();
      log('waiting 15 s of singing…');
      await new Promise((r) => setTimeout(r, 15000));
      const before = audio.duckLevel;
      const reading = readPsalm();
      setTimeout(() => log(`music level while reading: ${Math.round(audio.duckLevel * 100)}% (was ${Math.round(before * 100)}%)`), 1500);
      await reading;
      setTimeout(() => log(`music level after reading: ${Math.round(audio.duckLevel * 100)}%`), 1200);
    };
  </script>
</body>
</html>
