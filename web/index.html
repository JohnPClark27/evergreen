<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9ED">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Evergreen</title>
  <meta name="description" content="Evergreen helps older Christians stay connected to the Word: Scripture read aloud, hymns, prayers and gentle Bible games, in large print with big buttons. Runs in the browser on a laptop or tablet, with no login.">
  <link rel="icon" type="image/png" href="img/evergreen-icon-64.png">
  <link rel="apple-touch-icon" href="img/evergreen-icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Evergreen">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- The brand bar: shown on every screen except Welcome and Engage further, which show the
       color wordmark themselves (app.js sets body[data-brand]). -->
  <header class="brandbar"><img src="img/evergreen-wordmark-white.png" alt="Evergreen" width="1154" height="224"></header>
  <main id="app" aria-live="off">
    <noscript><p class="big-text">Evergreen needs JavaScript turned on.</p></noscript>
  </main>

  <script src="config.js"></script>
  <!-- supabase-js, pinned with an integrity hash (see js/api.js SUPABASE_JS) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
